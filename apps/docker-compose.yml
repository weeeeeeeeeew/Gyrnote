name: gyrnote

# postgres-pgvector-data is a new volume so the old alpine data dir is left unused, not deleted.

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    env_file:
      - ./api/src/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.9-alpine3.21
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-pgvector-data:
  redis-data: