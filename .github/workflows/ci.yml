name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Production build
        run: pnpm build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --group dev

      - name: Ruff
        run: python -m ruff check --no-fix .

      - name: Mypy
        run: python -m mypy src

      - name: Pytest
        run: python -m pytest

  e2e:
    name: Full-stack E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_USER: gyrnote_ci
          POSTGRES_PASSWORD: gyrnote_ci
          POSTGRES_DB: gyrnote_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gyrnote_ci -d gyrnote_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4.9-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_NAME: Gyrnote API
      APP_VERSION: "0.1.0"
      ENVIRONMENT: local

      POSTGRES_USER: gyrnote_ci
      POSTGRES_PASSWORD: gyrnote_ci
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gyrnote_ci
      POSTGRES_ASYNC_PREFIX: postgresql+asyncpg://

      REDIS_CACHE_HOST: 127.0.0.1
      REDIS_CACHE_PORT: "6379"
      REDIS_QUEUE_HOST: 127.0.0.1
      REDIS_QUEUE_PORT: "6379"
      REDIS_RATE_LIMIT_HOST: 127.0.0.1
      REDIS_RATE_LIMIT_PORT: "6379"

      SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CRUD_ADMIN_ENABLED: "false"
      CLIENT_CACHE_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --group dev

      - name: Start backend and wait until ready
        working-directory: apps/api
        run: |
          python -m uvicorn src.app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > "$RUNNER_TEMP/api.log" 2>&1 &

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready; then
              exit 0
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium E2E
        working-directory: apps/web
        run: pnpm exec playwright test --project=chromium

      - name: Print backend log after failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"